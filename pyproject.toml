[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "selfheal-ai-microservices"
version = "1.0.0"
description = "AI self-healing microservices platform: anomaly detection, LLM-assisted diagnosis and guarded, verified auto-remediation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bharatkumar Chandvani" }]
requires-python = ">=3.11"
keywords = ["ai", "llm", "ai-agents", "aiops", "self-healing", "microservices", "sre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Monitoring",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
selfheal = "selfheal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/selfheal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length is enforced by ruff format

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/selfheal"]
